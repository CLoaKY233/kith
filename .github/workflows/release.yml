name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Release tags commit the built page, so `cargo install` from the tag never needs Node.
  # The tag's commit sits on top of the release commit and is not merged into main:
  #   git switch --detach main
  #   (cd crates/management/kith-ui/web && npm ci && npm run build)
  #   git add -f crates/management/kith-ui/web/dist && git commit -m "Add the built page for vX.Y.Z"
  #   git tag vX.Y.Z && git push origin vX.Y.Z
  # This job fails the release when the committed page is missing or is not what the tag's
  # sources build.
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crates/management/kith-ui/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.10.0
      - name: the tag commits web/dist
        run: |
          if ! git ls-files --error-unmatch dist/index.html > /dev/null 2>&1; then
            echo "::error::$GITHUB_REF_NAME does not commit crates/management/kith-ui/web/dist; see the comment above this job in release.yml."
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm run size
      - name: the committed page is what the sources build
        run: |
          changed="$(git status --porcelain --ignored=matching -- dist)"
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::web/dist on $GITHUB_REF_NAME is stale; rebuild it with npm ci && npm run build and tag again."
            exit 1
          fi

  # No caches in this workflow: a shipped binary must not depend on what another run left
  # in the Actions cache.
  build:
    needs: page
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, ui: true, os: ubuntu-latest, profile: embedded, zig: true }
          - { target: aarch64-unknown-linux-musl, ui: true, os: ubuntu-latest, profile: embedded, zig: true }
          - { target: armv7-unknown-linux-musleabihf, os: ubuntu-latest, profile: embedded, zig: true }
          # MIPS (nightly: true) is off until router builds: 32-bit MIPS has no AtomicU64.
          - { target: aarch64-apple-darwin, ui: true, os: macos-latest, profile: dist }
          - { target: x86_64-apple-darwin, ui: true, os: macos-latest, profile: dist }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.nightly == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - if: ${{ !matrix.nightly }}
        run: rustup target add ${{ matrix.target }}
      - if: ${{ matrix.nightly }}
        run: rustup toolchain install nightly --profile minimal --component rust-src,llvm-tools
      - if: ${{ matrix.zig }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - if: ${{ matrix.zig }}
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with: { tool: cargo-zigbuild }
      - if: ${{ matrix.zig && !matrix.nightly }}
        run: cargo zigbuild -p kith-cli --profile ${{ matrix.profile }} --target ${{ matrix.target }} --locked
      - if: ${{ matrix.nightly }}
        run: cargo +nightly zigbuild -p kith-cli --profile ${{ matrix.profile }} --target ${{ matrix.target }} --locked -Zbuild-std=std,panic_abort
      - if: ${{ !matrix.zig }}
        run: cargo build -p kith-cli --profile ${{ matrix.profile }} --target ${{ matrix.target }} --locked
      - if: ${{ matrix.ui && matrix.zig }}
        run: cargo zigbuild -p kith-ui --profile dist --target ${{ matrix.target }} --locked
      - if: ${{ matrix.ui && !matrix.zig }}
        run: cargo build -p kith-ui --profile dist --target ${{ matrix.target }} --locked
      - name: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PROFILE: ${{ matrix.profile }}
          TOOLCHAIN: ${{ matrix.nightly && 'nightly' || '' }}
          UI: ${{ matrix.ui && '1' || '' }}
          COPYFILE_DISABLE: "1"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="kith-${version}-${TARGET}"
          bin="target/${TARGET}/${PROFILE}/kith"
          sysroot="$(rustc ${TOOLCHAIN:++$TOOLCHAIN} --print sysroot)"
          strip_bin="$(find "$sysroot/lib/rustlib" -name llvm-strip -type f | head -n1)"
          if [ -n "$strip_bin" ]; then "$strip_bin" "$bin"; elif [ "$RUNNER_OS" = macOS ]; then strip "$bin"; fi
          mkdir -p "dist/$name"
          cp "$bin" LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          if [ -n "$UI" ]; then
            ui_name="kith-ui-${version}-${TARGET}"
            ui_bin="target/${TARGET}/dist/kith-ui"
            if grep -q "built without its page" "$ui_bin"; then
              echo "::error::kith-ui for $TARGET embeds fallback.html instead of the built page."
              exit 1
            fi
            if [ -n "$strip_bin" ]; then "$strip_bin" "$ui_bin"; elif [ "$RUNNER_OS" = macOS ]; then strip "$ui_bin"; fi
            mkdir -p "dist/$ui_name"
            cp "$ui_bin" LICENSE "dist/$ui_name/"
            tar -C dist -czf "dist/$ui_name.tar.gz" "$ui_name"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # The desktop shell (apps/kith-app): its own workspace, built with the Tauri CLI into
  # native bundles. It embeds the committed kith-ui/web/dist, like kith-ui.
  app:
    needs: page
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, bundles: "app,dmg" }
          - { target: x86_64-apple-darwin, os: macos-latest, bundles: "app,dmg" }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, bundles: "deb,appimage" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/kith-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup target add ${{ matrix.target }}
      - if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: npm ci
      - run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          bundle="target/${TARGET}/release/bundle"
          for file in "$bundle"/dmg/*.dmg "$bundle"/deb/*.deb "$bundle"/appimage/*.AppImage; do
            [ -e "$file" ] || continue
            out="dist/kith-app-${version}-${TARGET}.${file##*.}"
            if [ -e "$out" ]; then
              echo "::error::more than one .${file##*.} bundle for $TARGET"
              exit 1
            fi
            cp "$file" "$out"
          done
          ls dist/kith-app-*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-${{ matrix.target }}
          path: apps/kith-app/dist/kith-app-*
          if-no-files-found: error

  # Publishes only when every build and bundle succeeded: a release missing an archive
  # breaks install.sh for that platform, and a published tag cannot be re-run.
  release:
    needs: [page, build, app]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          version="${GITHUB_REF_NAME#v}"
          missing=""
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl armv7-unknown-linux-musleabihf aarch64-apple-darwin x86_64-apple-darwin; do
            [ -f "kith-${version}-${target}.tar.gz" ] || missing="$missing kith-${version}-${target}.tar.gz"
          done
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin x86_64-apple-darwin; do
            [ -f "kith-ui-${version}-${target}.tar.gz" ] || missing="$missing kith-ui-${version}-${target}.tar.gz"
          done
          if [ -n "$missing" ]; then
            echo "::error::install.sh needs these archives, which no build produced:$missing"
            exit 1
          fi
          sha256sum kith-*.tar.gz kith-app-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag kith-*.tar.gz kith-app-* SHA256SUMS
