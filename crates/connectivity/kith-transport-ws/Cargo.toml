[package]
name = "kith-transport-ws"
description = "TLS and WebSocket link driver, CDN-compatible"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
kith-transport-udp.workspace = true
data-encoding = { workspace = true, features = ["alloc"] }
kith-crypto = { workspace = true, features = ["getrandom"] }
rustls.workspace = true
rustls-pki-types.workspace = true
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync", "time"] }
tokio-rustls.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
