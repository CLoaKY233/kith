[package]
name = "kith-tun"
description = "TUN device driver with batched reads and writes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
thiserror = { workspace = true, features = ["std"] }
# `rt` to report a missing runtime instead of panicking.
tokio = { workspace = true, features = ["rt"] }
# No `address-management`: initial addresses work without it.
tun-rs = { workspace = true, features = ["async_tokio"] }

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
