[package]
name = "kith-crypto"
description = "The narrow cryptography facade: Ed25519, X25519, ChaCha20-Poly1305 and BLAKE3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# Key generation from the operating system's random source.
getrandom = ["dep:getrandom"]

[dependencies]
blake3 = { workspace = true, features = ["zeroize"] }
chacha20poly1305 = { workspace = true, features = ["alloc", "zeroize"] }
ed25519-dalek = { workspace = true, features = ["zeroize"] }
getrandom = { workspace = true, optional = true }
kith-types.workspace = true
serde.workspace = true
thiserror.workspace = true
x25519-dalek = { workspace = true, features = ["static_secrets", "zeroize"] }
zeroize.workspace = true

[dev-dependencies]
postcard = { workspace = true, features = ["alloc"] }
proptest.workspace = true

[lints]
workspace = true
