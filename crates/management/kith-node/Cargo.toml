[package]
name = "kith-node"
description = "Composition root that wires every plane together"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
test-support = ["kith-dataplane/test-support"]

[dependencies]
kith-channel.workspace = true
