kith-ledger.workspace = true
kith-naming.workspace = true
kith-netmon.workspace = true
kith-policy.workspace = true
kith-relay.workspace = true
kith-router.workspace = true
kith-stun.workspace = true
kith-store.workspace = true
kith-sys.workspace = true
kith-transport.workspace = true
kith-transport-quic.workspace = true
kith-transport-udp.workspace = true
kith-transport-ws.workspace = true
kith-tun.workspace = true
kith-types.workspace = true
rustls-pki-types.workspace = true
toml.workspace = true
