[package]
name = "kith-ui"
description = "A local web page for kith, served on 127.0.0.1 and backed by the daemon's IPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
# Release tags commit `web/dist`, so building from the package never needs Node.
include = ["Cargo.toml", "build.rs", "fallback.html", "src/**", "web/dist/**"]

[[bin]]
name = "kith-ui"
path = "src/main.rs"

[dependencies]
axum = { workspace = true, features = ["http1", "tokio"] }
bpaf.workspace = true
kith-config.workspace = true
kith-ui-core.workspace = true
opener.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "signal"] }

[build-dependencies]
brotli.workspace = true

[lints]
workspace = true
