[package]
name = "kith-ui"
description = "A local web page for kith, served on 127.0.0.1 and backed by the daemon's IPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "kith-ui"
path = "src/main.rs"

[dependencies]
bpaf.workspace = true
bytes = { workspace = true, features = ["std"] }
http-body-util = { workspace = true, features = ["channel"] }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
kith-config.workspace = true
kith-crypto = { workspace = true, features = ["getrandom"] }
kith-ipc.workspace = true
kith-types.workspace = true
qrcode = { workspace = true, features = ["svg"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "time"] }

[lints]
workspace = true
