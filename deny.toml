# cargo-deny: supply-chain policy. Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  # The Mozilla root certificate list in webpki-roots.
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies are unpublished (`publish = false`) and versioned together.
allow-wildcard-paths = true
highlight = "all"
deny = [
  { name = "openssl", reason = "pure-Rust TLS only (rustls); OpenSSL breaks cross-compiling" },
  { name = "openssl-sys", reason = "pure-Rust TLS only (rustls); OpenSSL breaks cross-compiling" },
  { name = "native-tls", reason = "pure-Rust TLS only (rustls)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
